<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Interactive Art</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <h1>Interactive Art</h1>
      <p class="sub">Created by archiveknock</p>
    </div>
    <button id="btnImmersive" class="ghost" title="몰입 모드 (전체 화면)">⛶ 몰입 모드</button>
  </header>

  <main>
    <section class="viewer" id="viewer">
      <div class="stage" id="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="status" class="status">카메라를 켜면 시작합니다</div>
        <div id="recDot" class="rec-dot" hidden><span></span><b id="recTime">0:00</b></div>
        <div id="detect" class="detect" hidden></div>
      </div>

      <!-- 몰입 모드에서만 보이는 떠 있는 조작부 -->
      <div id="floating" class="floating">
        <button class="ficon fx" data-fx="roach" title="바퀴벌레 잡기">🪳</button>
        <button class="ficon fx" data-fx="finger" title="손가락 메시지">💬</button>
        <button class="ficon fx" data-fx="melody" title="손가락 멜로디">🎵</button>
        <i class="fsep"></i>
        <button class="ficon" id="fRec" title="녹화">⏺</button>
        <button class="ficon" id="fShot" title="스냅샷">📷</button>
        <button class="ficon" id="fExit" title="몰입 모드 종료">✕</button>
      </div>
    </section>

    <aside class="panel">
      <div class="effects">
        <button class="fx is-on" data-fx="roach" title="바퀴벌레 잡기"><b>바퀴벌레</b><span>🪳</span></button>
        <button class="fx" data-fx="finger" title="손가락 메시지"><b>메시지</b><span>💬</span></button>
        <button class="fx" data-fx="melody" title="손가락 멜로디"><b>멜로디</b><span>🎵</span></button>
      </div>

      <label class="field" id="msgField">
        메시지 <span class="for">공백 제외 8글자</span>
        <input id="fingerMsg" type="text" value="I LOVE YOU" maxlength="24" />
      </label>

      <button id="btnStart" class="primary">카메라 켜기</button>

      <div class="row">
        <button id="btnRec" disabled>● 녹화 시작</button>
        <button id="btnShot" disabled>스냅샷</button>
      </div>

      <details class="more">
        <summary>고급 설정</summary>
        <label class="check"><input id="withAudio" type="checkbox" /> 마이크 소리 함께 녹음</label>
        <label class="check" id="tabAudioField" hidden>
          <input id="withTabAudio" type="checkbox" /> 읽어주는 음성까지 녹음
        </label>
        <label class="check"><input id="cpuMode" type="checkbox" /> GPU 가속 끄기</label>
        <p class="note">
          녹화는 화면에 보이는 그대로, 효과음과 함께 저장됩니다.
          읽어주는 음성은 브라우저가 소리를 내주지 않아 그대로는 담기지 않습니다.
          위 항목을 켜면 녹화 시작 시 공유 창이 열리며, <b>이 탭</b>을 고르고
          <b>탭 오디오 공유</b>를 함께 선택하면 음성까지 저장됩니다.
        </p>
      </details>

      <p class="privacy">영상은 기기 안에서만 처리되며 서버로 전송되지 않습니다.</p>
      <p id="note" class="diag" hidden></p>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
